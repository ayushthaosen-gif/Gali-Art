name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (exclude non-site files)
        run: |
          mkdir _site
          cp -r index.html 404.html privacy.html config.js css js assets data frame-preview _site/
          rm -f _site/frame-preview/index.html _site/frame-preview/README.md
      - name: Stamp version (cache busting)
        run: |
          V=${GITHUB_SHA::7}
          sed -i "s/version: \"dev\"/version: \"$V\"/" _site/config.js
          sed -i -E "s#(src|href)=\"(css/style.css|config.js|js/poster.js|js/app.js|frame-preview/frame.css|frame-preview/frame.js)\"#\1=\"\2?v=$V\"#g" _site/index.html _site/privacy.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
